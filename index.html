  <div class="page">

        <div class="halal" aria-label="Халал">

          <span class="halal-en">HALAL</span>
        </div>
        <div class="brand">
          <div class="logo">Восточка</div>
          <div class="brand-sub">Торты · Пироги · Выпечка</div>
        </div>
        <div class="top-actions">
          <a id="callBtn" class="icon-btn" href="#" aria-label="Позвонить" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8z"/></svg>

          </a>
        </div>
      </div>
    </header>

    <div class="sticky" id="sticky">
      <div class="tabs" role="tablist" aria-label="Разделы сайта">
        <button class="tab" role="tab" type="button" data-tab="menu" aria-selected="true"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z"/></svg><span>Меню и доставка</span></button>

      </div>
      <nav class="catnav" id="catnav" aria-label="Категории меню"></nav>
    </div>

    <div class="last-banner" id="lastBanner" hidden></div>

    <div id="view-menu" class="view">
      <main id="menu"></main>
    </div>

    <div id="view-events" class="view" hidden></div>

    <footer class="footer">
      <div class="orn" aria-hidden="true"><span></span></div>
      <div class="footer-logo">Восточка</div>
      <p id="footerInfo"></p>
      <p class="footer-small">Цены указаны в тенге · Халал</p>
      <p class="footer-small" id="photoCredits" hidden>Фото блюд — для примера, подача может отличаться · <button type="button" class="footer-link" data-credits>Авторы фото</button></p>
      <div class="band" aria-hidden="true"></div>
    </footer>
  </div>

  <div class="cartbar" id="cartbar" hidden>
    <button class="cartbar-btn" id="openCart" type="button">
      <span class="cartbar-ic"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0 0 20 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg><span class="cartbar-count" id="cartCount">0</span></span>
      <span class="cartbar-label">Корзина</span>
      <span class="cartbar-sum" id="cartSum">0 ₸</span>
    </button>
  </div>

  <div class="cartbar" id="evbar" hidden>
    <button class="cartbar-btn" id="openEv" type="button">
      <span class="cartbar-ic"><span class="cartbar-emoji"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.5 3.5 18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2v20l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5zM19 19.09H5V4.91h14v14.18zM6 15h12v2H6zm0-4h12v2H6zm0-4h12v2H6z"/></svg></span><span class="cartbar-count" id="evCount">0</span></span>
      <span class="cartbar-label">Ваш стол<small id="evGuestsLbl"></small></span>
      <span class="cartbar-sum" id="evSum">0 ₸</span>
    </button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-close></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head">
        <button class="sheet-back" type="button" id="sheetBack" aria-label="Назад" hidden>
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <h3 id="sheetTitle"></h3>
        <span class="sheet-extra" id="sheetExtra"></span>
        <button class="sheet-x" type="button" data-close aria-label="Закрыть">×</button>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
      <div class="sheet-foot" id="sheetFoot" hidden></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=26"></script>
  <script src="menu.js?v=26"></script>
  <script src="app.js?v=26"></script>
</body>
</html>
